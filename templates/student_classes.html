<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPulse - Select Classes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back-btn {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
        }

        .user-info {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .user-info strong {
            color: var(--text-main);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .class-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .class-card:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.1);
        }

        .class-card.enrolled {
            border-color: var(--accent-green);
            background: rgba(34, 197, 94, 0.05);
        }

        .class-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .class-period {
            background: var(--accent-blue);
            color: #000;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .class-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .class-teacher {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .class-details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .detail-label {
            color: var(--text-muted);
        }

        .detail-value {
            font-weight: 600;
        }

        .grade-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-blue);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 8px;
        }

        .action-btn {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .enroll-btn {
            background: linear-gradient(135deg, var(--accent-green) 0%, #16a34a 100%);
            color: white;
        }

        .enroll-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        .drop-btn {
            background: var(--card-bg);
            color: var(--accent-red);
            border: 2px solid var(--accent-red);
        }

        .drop-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .enrolled-badge {
            display: inline-block;
            background: var(--accent-green);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 4px;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .grid-container {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <a href="/student" class="back-btn">← Back to Dashboard</a>
                <div class="title">Select Your Classes</div>
            </div>
            <div class="user-info">
                <strong>{{ user.full_name }}</strong> - Grade {{ user.grade }} | {{ school.name }}
            </div>
        </div>

        <div class="success message" id="successMsg">✓ Action completed successfully!</div>
        <div class="error message" id="errorMsg">✗ An error occurred</div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-value" id="totalClasses">0</div>
                <div class="stat-label">Available Classes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="enrolledCount">0</div>
                <div class="stat-label">Classes Enrolled</div>
            </div>
        </div>

        <!-- Classes Grid -->
        <div id="classesContainer" class="grid-container"></div>
    </div>

    <script>
        const enrolledClassIds = {{ enrolled_class_ids | tojson }};
        const allClasses = {{ classes | tojson }};

        function initPage() {
            renderClasses();
            updateStats();
        }

        function renderClasses() {
            const container = document.getElementById('classesContainer');
            
            if (allClasses.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-state-icon">📚</div>
                        <h2>No Classes Available</h2>
                        <p>There are no classes available for your grade level.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = allClasses.map(cls => {
                const isEnrolled = enrolledClassIds.includes(cls.id);
                const gradeBadge = cls.min_grade || cls.max_grade 
                    ? `Grade ${cls.min_grade || '9'}-${cls.max_grade || '12'}` 
                    : 'All Grades';
                
                return `
                    <div class="class-card ${isEnrolled ? 'enrolled' : ''}">
                        <div class="class-header">
                            <div>
                                <div class="class-period">Period ${cls.period}</div>
                                <div class="class-name">${cls.name}</div>
                                <div class="class-teacher">${cls.teacher || 'No teacher assigned'}</div>
                            </div>
                            ${isEnrolled ? '<div class="enrolled-badge">✓ Enrolled</div>' : ''}
                        </div>
                        
                        <div class="class-details">
                            <div class="detail-item">
                                <span class="detail-label">Room:</span>
                                <span class="detail-value">${cls.room}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Time:</span>
                                <span class="detail-value">${cls.start_time} - ${cls.end_time}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Eligibility:</span>
                                <span class="detail-value"><span class="grade-badge">${gradeBadge}</span></span>
                            </div>
                        </div>
                        
                        ${isEnrolled 
                            ? `<button class="action-btn drop-btn" onclick="dropClass(${cls.id})">Drop Class</button>`
                            : `<button class="action-btn enroll-btn" onclick="enrollClass(${cls.id})">Enroll Now</button>`
                        }
                    </div>
                `;
            }).join('');
        }

        async function enrollClass(classId) {
            try {
                const res = await fetch('/api/student/enroll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ class_id: classId })
                });

                if (res.ok) {
                    enrolledClassIds.push(classId);
                    renderClasses();
                    updateStats();
                    showSuccess('Successfully enrolled in class!');
                } else {
                    const data = await res.json();
                    showError(data.error || 'Failed to enroll in class');
                }
            } catch (error) {
                showError('Error: ' + error.message);
            }
        }

        async function dropClass(classId) {
            if (!confirm('Are you sure you want to drop this class?')) return;

            try {
                const res = await fetch(`/api/student/enroll/${classId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (res.ok) {
                    enrolledClassIds = enrolledClassIds.filter(id => id !== classId);
                    renderClasses();
                    updateStats();
                    showSuccess('Successfully dropped class!');
                } else {
                    showError('Failed to drop class');
                }
            } catch (error) {
                showError('Error: ' + error.message);
            }
        }

        function updateStats() {
            document.getElementById('totalClasses').textContent = allClasses.length;
            document.getElementById('enrolledCount').textContent = enrolledClassIds.length;
        }

        function showSuccess(msg) {
            const msgEl = document.getElementById('successMsg');
            msgEl.textContent = '✓ ' + msg;
            msgEl.classList.add('show');
            setTimeout(() => msgEl.classList.remove('show'), 3000);
        }

        function showError(msg) {
            const msgEl = document.getElementById('errorMsg');
            msgEl.textContent = '✗ ' + msg;
            msgEl.classList.add('show');
            setTimeout(() => msgEl.classList.remove('show'), 3000);
        }

        // Initialize on page load
        initPage();
    </script>
</body>
</html>
